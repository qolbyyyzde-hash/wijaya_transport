version: '3.8'
services:
  app:
    build: .
    container_name: wijaya_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:cached
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - PHP_ERROR_REPORTING=E_ALL
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: wijaya_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wijaya
      MYSQL_USER: wijaya
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
